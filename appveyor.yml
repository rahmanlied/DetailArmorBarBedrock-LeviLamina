
image: Visual Studio 2022
clone_depth: 1
skip_branch_with_pr: false

environment:
  TARGET_VERSION: "26.51.1"
  MOD_NAME: "DetailArmorBarBedrock"

install:
  - ps: |
      $ErrorActionPreference = 'Stop'

      choco install xmake -y --no-progress
      if ($LASTEXITCODE -ne 0) {
          throw "Chocolatey gagal memasang XMake."
      }

      choco install llvm -y --no-progress
      if ($LASTEXITCODE -ne 0) {
          throw "Chocolatey gagal memasang LLVM."
      }

      $candidates = @(
          'C:\Program Files\xmake\xmake.exe',
          'C:\Program Files (x86)\xmake\xmake.exe',
          'C:\ProgramData\chocolatey\bin\xmake.exe'
      )

      $xmakeExe = (Get-Command xmake.exe -ErrorAction SilentlyContinue).Source

      if (-not $xmakeExe) {
          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  $xmakeExe = $candidate
                  break
              }
          }
      }

      if (-not $xmakeExe) {
          throw "xmake.exe tidak ditemukan."
      }

      $env:Path = "$(Split-Path $xmakeExe -Parent);C:\Program Files\LLVM\bin;$env:Path"

      Set-Content `
          -Path "$env:APPVEYOR_BUILD_FOLDER\xmake-path.txt" `
          -Value $xmakeExe `
          -Encoding ASCII

      & $xmakeExe --version
      if ($LASTEXITCODE -ne 0) {
          throw "XMake gagal dijalankan."
      }

      clang-cl --version
      if ($LASTEXITCODE -ne 0) {
          throw "clang-cl gagal dijalankan."
      }

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'

      $xmakeFile = Join-Path $env:APPVEYOR_BUILD_FOLDER 'xmake-path.txt'
      if (-not (Test-Path $xmakeFile)) {
          throw "File lokasi XMake tidak ditemukan."
      }

      $xmakeExe = (Get-Content $xmakeFile -Raw).Trim()
      $env:Path = "$(Split-Path $xmakeExe -Parent);C:\Program Files\LLVM\bin;$env:Path"

      & $xmakeExe f -y -p windows -a x64 -m release --target_type=client
      if ($LASTEXITCODE -ne 0) {
          throw "XMake configuration failed ($LASTEXITCODE)"
      }

      & $xmakeExe build FeatureLogicTests
      if ($LASTEXITCODE -ne 0) {
          throw "FeatureLogicTests build failed ($LASTEXITCODE)"
      }

      & $xmakeExe run FeatureLogicTests
      if ($LASTEXITCODE -ne 0) {
          throw "FeatureLogicTests failed ($LASTEXITCODE)"
      }

      & $xmakeExe build DetailArmorBarBedrock
      if ($LASTEXITCODE -ne 0) {
          throw "LeviLamina client build failed ($LASTEXITCODE)"
      }

      $dll = Get-ChildItem -Path . -Filter 'DetailArmorBarBedrock.dll' -Recurse |
          Where-Object { $_.FullName -notmatch '\\dist\\' } |
          Select-Object -First 1

      if (-not $dll) {
          throw "DLL tidak ditemukan setelah build."
      }

      $dist = Join-Path $env:APPVEYOR_BUILD_FOLDER 'dist'
      New-Item -ItemType Directory -Force -Path $dist | Out-Null

      Copy-Item $dll.FullName `
          (Join-Path $dist 'DetailArmorBarBedrock.dll') -Force

      Copy-Item 'README.md' $dist -Force
      Copy-Item 'LICENSE' $dist -Force

      $textureSource = 'resources/java-reference/textures'
      if (Test-Path $textureSource) {
          New-Item -ItemType Directory -Force `
              -Path (Join-Path $dist 'resources') | Out-Null

          Copy-Item $textureSource `
              (Join-Path $dist 'resources') -Recurse -Force
      }

      @{
          name = 'DetailArmorBarBedrock'
          entry = 'DetailArmorBarBedrock.dll'
          version = '0.2.0-dev'
          type = 'native'
          platform = 'windows'
      } | ConvertTo-Json |
          Set-Content (Join-Path $dist 'manifest.json') -Encoding UTF8

      Compress-Archive `
          -Path (Join-Path $dist '*') `
          -DestinationPath 'DetailArmorBarBedrock-client-windows-x64.zip' `
          -Force

on_failure:
  - ps: |
      $ErrorActionPreference = 'Continue'

      $diag = Join-Path $env:APPVEYOR_BUILD_FOLDER 'diagnostics'
      New-Item -ItemType Directory -Force -Path $diag | Out-Null

      $logPaths = @(
          "$env:LOCALAPPDATA\.xmake\cache\packages\2610\m\mimalloc\v3.5.0\installdir.failed\logs\install.txt",
          "$env:LOCALAPPDATA\.xmake\cache\packages\2610\l\levilamina\v26.51.1\installdir.failed\logs\install.txt"
      )

      foreach ($logPath in $logPaths) {
          if (Test-Path $logPath) {
              $name = if ($logPath -match '\\mimalloc\\') {
                  'mimalloc-install.txt'
              } else {
                  'levilamina-install.txt'
              }

              Copy-Item $logPath (Join-Path $diag $name) -Force
          }
      }

      $cacheRoot = "$env:LOCALAPPDATA\.xmake\cache\packages"
      if (Test-Path $cacheRoot) {
          Get-ChildItem $cacheRoot -Filter 'install.txt' -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.FullName -match '\\(mimalloc|levilamina|demangler)\\'
              } |
              Select-Object -First 20 |
              ForEach-Object {
                  $safeName = ($_.FullName -replace '[\\/:*?"<>|]', '_')
                  Copy-Item $_.FullName (Join-Path $diag $safeName) -Force
              }
      }

artifacts:
  - path: DetailArmorBarBedrock-client-windows-x64.zip
    name: DetailArmorBarBedrock-client-windows-x64

  - path: dist\DetailArmorBarBedrock.dll
    name: Native DLL (development build)

  - path: diagnostics\**
    name: Build diagnostics
