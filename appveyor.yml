
image: Visual Studio 2022
clone_depth: 1
skip_branch_with_pr: false

cache:
  - .ci-tools
  - '%LOCALAPPDATA%\.xmake\packages'
  - '%LOCALAPPDATA%\.xmake\cache'

environment:
  TARGET_VERSION: "26.51.1"
  MOD_NAME: "DetailArmorBarBedrock"
  APPVEYOR_SAVE_CACHE_ON_ERROR: "true"

install:
  - ps: |
      $ErrorActionPreference = 'Stop'

      $repo = $env:APPVEYOR_BUILD_FOLDER
      $toolsDir = Join-Path $repo '.ci-tools'
      $xmakeDir = Join-Path $toolsDir 'xmake'
      $zipPath = Join-Path $toolsDir 'xmake-v3.1.1.win64.zip'

      New-Item -ItemType Directory -Force -Path $toolsDir |
          Out-Null

      $xmakeUrl = 'https://github.com/xmake-io/xmake/releases/download/v3.1.1/xmake-v3.1.1.win64.zip'
      $expectedHash = '33fdf2f34a0e45fa731c000d59590d27b13dec7011f69cbf575004ed9279b4a2'

      # Periksa ZIP dari cache terlebih dahulu.
      $downloadXmake = $true

      if (Test-Path -LiteralPath $zipPath) {
          $cachedHash = (
              Get-FileHash -LiteralPath $zipPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($cachedHash -eq $expectedHash) {
              Write-Host 'XMake ZIP ditemukan di cache dan hash valid.'
              $downloadXmake = $false
          }
          else {
              Write-Host 'Hash ZIP di cache tidak cocok. Mengunduh ulang.'
              Remove-Item -LiteralPath $zipPath -Force
          }
      }

      if ($downloadXmake) {
          Write-Host 'Mengunduh XMake 3.1.1...'

          Invoke-WebRequest `
              -Uri $xmakeUrl `
              -OutFile $zipPath `
              -UseBasicParsing

          $downloadedHash = (
              Get-FileHash -LiteralPath $zipPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($downloadedHash -ne $expectedHash) {
              Remove-Item -LiteralPath $zipPath -Force `
                  -ErrorAction SilentlyContinue

              throw "Hash XMake tidak cocok: $downloadedHash"
          }
      }

      # Gunakan hasil ekstraksi dari cache jika masih valid.
      $xmakeFile = Get-ChildItem `
          -LiteralPath $xmakeDir `
          -Filter 'xmake.exe' `
          -File `
          -Recurse `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

      if (-not $xmakeFile) {
          Write-Host 'Ekstraksi XMake diperlukan.'

          if (Test-Path -LiteralPath $xmakeDir) {
              Remove-Item -LiteralPath $xmakeDir `
                  -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $xmakeDir |
              Out-Null

          Expand-Archive `
              -LiteralPath $zipPath `
              -DestinationPath $xmakeDir `
              -Force

          $xmakeFile = Get-ChildItem `
              -LiteralPath $xmakeDir `
              -Filter 'xmake.exe' `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
      }

      if (-not $xmakeFile) {
          throw 'xmake.exe tidak ditemukan setelah ekstraksi.'
      }

      $xmakeExe = $xmakeFile.FullName
      $xmakeBin = Split-Path $xmakeExe -Parent

      Set-Content `
          -Path (Join-Path $repo 'xmake-path.txt') `
          -Value $xmakeExe `
          -Encoding ASCII

      $env:Path = "$xmakeBin;$env:Path"

      Write-Host '========== XMAKE VERSION =========='
      & $xmakeExe --version

      if ($LASTEXITCODE -ne 0) {
          throw 'XMake gagal dijalankan.'
      }

      # Gunakan LLVM yang sudah terpasang pada image AppVeyor.
      # Tidak mengunduh LLVM melalui Chocolatey.
      $clangPath = $null

      $clangCommand = Get-Command clang-cl.exe `
          -ErrorAction SilentlyContinue

      if ($clangCommand) {
          $clangPath = $clangCommand.Source
      }

      if (-not $clangPath) {
          $clangCandidates = @(
              (Join-Path $env:ProgramFiles 'LLVM\bin\clang-cl.exe'),
              'C:\Program Files (x86)\LLVM\bin\clang-cl.exe',
              'C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\bin\clang-cl.exe'
          )

          foreach ($candidate in $clangCandidates) {
              if (Test-Path -LiteralPath $candidate) {
                  $clangPath = $candidate
                  break
              }
          }
      }

      if (-not $clangPath) {
          throw @"
      clang-cl.exe tidak ditemukan pada image AppVeyor.
      Build dihentikan tanpa menjalankan Chocolatey atau mengunduh LLVM.
      Periksa software yang tersedia pada image Visual Studio 2022.
      "@
      }

      $llvmBin = Split-Path $clangPath -Parent

      Set-Content `
          -Path (Join-Path $repo 'llvm-bin-path.txt') `
          -Value $llvmBin `
          -Encoding ASCII

      $env:Path = "$llvmBin;$env:Path"

      Write-Host '========== CLANG VERSION =========='
      & $clangPath --version

      if ($LASTEXITCODE -ne 0) {
          throw 'clang-cl gagal dijalankan.'
      }

      Write-Host 'Toolchain berhasil diperiksa.'

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'

      $repo = $env:APPVEYOR_BUILD_FOLDER

      # Muat lokasi XMake dari proses install.
      $xmakePathFile = Join-Path $repo 'xmake-path.txt'

      if (-not (Test-Path -LiteralPath $xmakePathFile)) {
          throw 'File xmake-path.txt tidak ditemukan.'
      }

      $xmakeExe = (Get-Content -LiteralPath $xmakePathFile -Raw).Trim()

      if (-not (Test-Path -LiteralPath $xmakeExe)) {
          throw "XMake tidak ditemukan: $xmakeExe"
      }

      # Muat lokasi LLVM yang sudah diperiksa saat install.
      $llvmPathFile = Join-Path $repo 'llvm-bin-path.txt'

      if (-not (Test-Path -LiteralPath $llvmPathFile)) {
          throw 'File llvm-bin-path.txt tidak ditemukan.'
      }

      $llvmBin = (Get-Content -LiteralPath $llvmPathFile -Raw).Trim()
      $clangPath = Join-Path $llvmBin 'clang-cl.exe'

      if (-not (Test-Path -LiteralPath $clangPath)) {
          throw "clang-cl.exe tidak ditemukan: $clangPath"
      }

      $env:Path = "$(Split-Path $xmakeExe -Parent);$llvmBin;$env:Path"

      # Folder diagnostik.
      $diag = Join-Path $repo 'diagnostics'

      New-Item -ItemType Directory -Force -Path $diag |
          Out-Null

      # Jalankan XMake sambil menyimpan semua output ke log.
      # ErrorActionPreference sementara diubah agar pesan stderr dari
      # proses eksternal tidak langsung menghentikan pipeline PowerShell.
      # Keberhasilan tetap ditentukan dari exit code XMake.
      function Invoke-XmakeLogged {
          param(
              [Parameter(Mandatory = $true)]
              [string[]]$Arguments,

              [Parameter(Mandatory = $true)]
              [string]$LogPath
          )

          $previousErrorActionPreference = $ErrorActionPreference
          $nativeExitCode = 1

          try {
              $ErrorActionPreference = 'Continue'

              & $xmakeExe @Arguments 2>&1 |
                  Tee-Object -FilePath $LogPath |
                  ForEach-Object {
                      Write-Host "$_"
                  }

              $nativeExitCode = $LASTEXITCODE

              if ($null -eq $nativeExitCode) {
                  $nativeExitCode = 1
              }
          }
          finally {
              $ErrorActionPreference = $previousErrorActionPreference
          }

          return [int]$nativeExitCode
      }

      # Fungsi diagnostik untuk log instalasi dependency.
      function Show-PackageDiagnostics {
          $cacheRoot = Join-Path $env:LOCALAPPDATA '.xmake\cache\packages'

          Write-Host ''
          Write-Host '========== INTERNAL XMAKE PACKAGE DIAGNOSTICS =========='

          if (-not (Test-Path -LiteralPath $cacheRoot)) {
              Write-Host "Folder cache XMake tidak ditemukan: $cacheRoot"
              return
          }

          $logs = @(
              Get-ChildItem `
                  -LiteralPath $cacheRoot `
                  -Filter 'install.txt' `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.FullName -match '\\(mimalloc|levilamina|demangler)\\'
              } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 20
          )

          if ($logs.Count -eq 0) {
              Write-Host 'Tidak ditemukan install.txt untuk mimalloc, LeviLamina, atau Demangler.'
              Write-Host "Periksa juga folder cache secara manual: $cacheRoot"
              return
          }

          foreach ($file in $logs) {
              $relativePath = $file.FullName.Substring(
                  $cacheRoot.Length
              ).TrimStart('\')

              $safeName = $relativePath -replace '[\\/:*?"<>|]', '_'
              $destination = Join-Path $diag $safeName

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path (Split-Path $destination -Parent) |
                  Out-Null

              Copy-Item `
                  -LiteralPath $file.FullName `
                  -Destination $destination `
                  -Force

              Write-Host ''
              Write-Host "========== LOG: $($file.FullName) =========="

              Get-Content `
                  -LiteralPath $file.FullName `
                  -Tail 250 |
                  ForEach-Object {
                      Write-Host "$_"
                  }

              Write-Host '========== END LOG =========='
          }

          Write-Host '========== END PACKAGE DIAGNOSTICS =========='
      }

      # Konfigurasi target Windows x64 client.
      $configLog = Join-Path $diag 'xmake-config.log'

      Write-Host '========== XMAKE CONFIGURATION =========='

      $configExitCode = Invoke-XmakeLogged `
          -Arguments @(
              'f',
              '-y',
              '-p', 'windows',
              '-a', 'x64',
              '-m', 'release',
              '--target_type=client'
          ) `
          -LogPath $configLog

      if ($configExitCode -ne 0) {
          Show-PackageDiagnostics
          throw "XMake configuration failed (exit code $configExitCode). Periksa diagnostics/xmake-config.log."
      }

      # Build unit tests.
      $testBuildLog = Join-Path $diag 'feature-tests-build.log'

      Write-Host '========== BUILD FEATURE TESTS =========='

      $testBuildExitCode = Invoke-XmakeLogged `
          -Arguments @('build', 'FeatureLogicTests') `
          -LogPath $testBuildLog

      if ($testBuildExitCode -ne 0) {
          throw "FeatureLogicTests build failed (exit code $testBuildExitCode). Periksa diagnostics/feature-tests-build.log."
      }

      # Jalankan unit tests.
      $testRunLog = Join-Path $diag 'feature-tests-run.log'

      Write-Host '========== RUN FEATURE TESTS =========='

      $testRunExitCode = Invoke-XmakeLogged `
          -Arguments @('run', 'FeatureLogicTests') `
          -LogPath $testRunLog

      if ($testRunExitCode -ne 0) {
          throw "FeatureLogicTests failed (exit code $testRunExitCode). Periksa diagnostics/feature-tests-run.log."
      }

      # Build DLL mod LeviLamina.
      $modBuildLog = Join-Path $diag 'mod-build.log'

      Write-Host '========== BUILD DETAIL ARMOR BAR MOD =========='

      $modBuildExitCode = Invoke-XmakeLogged `
          -Arguments @('build', 'DetailArmorBarBedrock') `
          -LogPath $modBuildLog

      if ($modBuildExitCode -ne 0) {
          Write-Host ''
          Write-Host '========== MOD BUILD FAILED =========='
          Write-Host "XMake exit code: $modBuildExitCode"
          Write-Host "Log: $modBuildLog"

          throw "LeviLamina client build failed (exit code $modBuildExitCode). Periksa diagnostics/mod-build.log."
      }

      # Cari DLL hasil build.
      $dll = Get-ChildItem `
          -Path $repo `
          -Filter 'DetailArmorBarBedrock.dll' `
          -File `
          -Recurse |
          Where-Object {
              $_.FullName -notmatch '\\(dist|\.ci-tools|diagnostics)\\'
          } |
          Select-Object -First 1

      if (-not $dll) {
          throw 'Build selesai tetapi DetailArmorBarBedrock.dll tidak ditemukan.'
      }

      # Siapkan folder distribusi.
      $dist = Join-Path $repo 'dist'

      New-Item -ItemType Directory -Force -Path $dist |
          Out-Null

      Copy-Item `
          -LiteralPath $dll.FullName `
          -Destination (Join-Path $dist 'DetailArmorBarBedrock.dll') `
          -Force

      if (-not (Test-Path (Join-Path $repo 'README.md'))) {
          throw 'README.md tidak ditemukan.'
      }

      if (-not (Test-Path (Join-Path $repo 'LICENSE'))) {
          throw 'LICENSE tidak ditemukan.'
      }

      Copy-Item `
          -LiteralPath (Join-Path $repo 'README.md') `
          -Destination $dist `
          -Force

      Copy-Item `
          -LiteralPath (Join-Path $repo 'LICENSE') `
          -Destination $dist `
          -Force

      # Sertakan referensi tekstur Java jika tersedia.
      $textureSource = Join-Path $repo 'resources/java-reference/textures'

      if (Test-Path -LiteralPath $textureSource) {
          $resources = Join-Path $dist 'resources'

          New-Item -ItemType Directory -Force -Path $resources |
              Out-Null

          Copy-Item `
              -Path $textureSource `
              -Destination $resources `
              -Recurse `
              -Force
      }

      # Manifest paket mod.
      @{
          name = 'DetailArmorBarBedrock'
          entry = 'DetailArmorBarBedrock.dll'
          version = '0.2.0-dev'
          type = 'native'
          platform = 'client'
      } |
          ConvertTo-Json |
          Set-Content `
              -Path (Join-Path $dist 'manifest.json') `
              -Encoding UTF8

      # Buat ZIP distribusi.
      $zipOutput = Join-Path $repo 'DetailArmorBarBedrock-client-windows-x64.zip'

      if (Test-Path -LiteralPath $zipOutput) {
          Remove-Item -LiteralPath $zipOutput -Force
      }

      Compress-Archive `
          -Path (Join-Path $dist '*') `
          -DestinationPath $zipOutput `
          -Force

      Write-Host '========== BUILD SUCCEEDED =========='
      Write-Host "DLL: $($dll.FullName)"
      Write-Host "ZIP: $zipOutput"

artifacts:
  - path: DetailArmorBarBedrock-client-windows-x64.zip
    name: DetailArmorBarBedrock-client-windows-x64

  - path: dist\DetailArmorBarBedrock.dll
    name: Native DLL (development build)

  - path: diagnostics
    name: Build diagnostics
    type: zip
